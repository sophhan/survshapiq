[project]
name = "real-data-tcga-brca"
version = "0.1.0"
description = "Multimodal Survival Analysis with Shapley Interactions on TCGA-BRCA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.0.0",
    "kagglehub>=0.4.0",
    "lifelines>=0.30.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pillow>=10.0.0",
    "pycox>=0.3.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "seaborn>=0.13.0",
    "shapiq>=1.4.1",
    "torch>=2.1.0",
    "torchtuples>=0.2.2",
    "tqdm>=4.66.0",
    "uni",
]

[tool.uv.sources]
uni = { git = "https://github.com/mahmoodlab/UNI.git" }
